
name: Vivace
version: 26.3-1
main: dev.vivace.Vivace
api-version: '1.19'
description: A useful utility plugin for Minecraft servers
author: VivaceTeam

commands:
  ender:
    description: Open your Ender Chest
    aliases: [ec]

  craft:
    description: Open a crafting table

  anvil:
    description: Open an anvil

  trash:
    description: Open the trash GUI

  coords:
    description: Show your coordinates

  stonecutter:
    description: Open a stonecutter

  vivace:
    description: Vivace administration command
    usage: /vivace <reload|info>
    aliases: [viv]

permissions:
  vivace.admin:
    description: Allows Vivace administration
    default: op
